# Generated works never share the main site's origin or login cookie.
server {
    listen 80;
    server_name *.apps.ontimo.cn *.preview.ontimo.cn;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name *.apps.ontimo.cn;
    ssl_certificate /etc/letsencrypt/live/nestdutio-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nestdutio-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:4186;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_hide_header Set-Cookie;
    }
}
server {
    listen 443 ssl;
    server_name *.preview.ontimo.cn;
    ssl_certificate /etc/letsencrypt/live/nestdutio-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nestdutio-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:4185;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_hide_header Set-Cookie;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
