[Unit]
Description=Nikai AI MariaDB database backup
ConditionPathExists=
ConditionPathExists=/opt/nikai-ai/.mariadb.cnf

[Service]
User=root
Group=root
ExecStart=
ExecStart=/usr/local/bin/node /opt/nikai-ai/scripts/active-database-backup.mjs /opt/nikai-ai
ReadWritePaths=
ReadWritePaths=/opt/nikai-ai-backups/mariadb
