components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: nikai_auth, description: HttpOnly SameSite=Lax；最长 30 天；Secure 依 HTTPS/可信代理而定}
    adminBearer: {type: http, scheme: bearer, description: NIKE_ADMIN_TOKEN；生产默认关闭共享令牌模式}
  parameters:
    ToolId: {name: toolId, in: path, required: true, schema: {$ref: '#/components/schemas/ToolId'}}
  schemas:
    Envelope:
      type: object
      required: [data]
      properties:
        data: {description: 接口资源}
        meta: {type: object, description: 分页/查询范围元数据}
    HealthEnvelope:
      type: object
      properties:
        data: {type: object, properties: {status: {type: string}, database: {type: boolean}, version: {type: integer}}}
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string}
        requestId: {type: string, format: uuid}
        details: {type: object, additionalProperties: true}
    ToolId: {type: string, pattern: '^[a-z0-9-]+$'}
    Rating: {type: object, required: [rating], properties: {rating: {type: integer, minimum: 1, maximum: 5}}}
    Register: {type: object, required: [displayName, email, password, consentAccepted, termsAccepted], properties: {displayName: {type: string, minLength: 2, maxLength: 40}, email: {type: string, format: email, maxLength: 254}, password: {type: string, format: password, minLength: 10, maxLength: 128}, consentVersion: {type: string, default: '2026-07'}, consentAccepted: {type: boolean, enum: [true]}, termsAccepted: {type: boolean, enum: [true]}}}
    Login: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, format: password, minLength: 10, maxLength: 128}}}
