openapi: 3.0.3
info:
  title: 泥壳 AI 工具站 API
  version: 1.0.0
  description: |
    按当前 server.mjs、backend/database.mjs、backend/validation.mjs 整理。成功 JSON 为 {data, meta?}，错误为 Problem Details。
    ID 使用字符串；时间戳 UTC ISO 8601；日期 YYYY-MM-DD；项目当前没有金额接口。生产数据库字段与管理员角色策略尚未在生产读取。
servers:
  - url: https://ontimo.cn
    description: 生产域名（本轮未访问生产）
  - url: http://127.0.0.1:4173
    description: 本地开发
security: []
tags:
  - {name: Health}
  - {name: Content}
  - {name: Auth}
  - {name: Account}
  - {name: Submissions}
  - {name: Newsletter}
  - {name: Feedback}
  - {name: Analytics}
  - {name: Image}
  - {name: Utilities}
  - {name: Admin}
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: 服务与数据库健康状态
      responses:
        '200':
          description: 健康
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthEnvelope'}
              example: {data: {status: ok, database: true, version: 1}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/health/live:
    get:
      tags: [Health]
      summary: 进程存活探针
      responses:
        '200': {description: 存活, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/health/ready:
    get:
      tags: [Health]
      summary: 数据库就绪探针
      responses:
        '200': {description: 就绪, content: {application/json: {schema: {$ref: '#/components/schemas/HealthEnvelope'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/site/bootstrap:
    get:
      tags: [Content]
      summary: 首页初始化分类、文章、专题与推广位
      responses:
        '200': {description: 初始化数据, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/site/growth:
    get:
      tags: [Content]
      summary: 公开增长概览
      responses:
        '200': {description: 聚合统计, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/content/version:
    get:
      tags: [Content]
      summary: 内容修订号
      responses:
        '200': {description: revision, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/site-announcements:
    get:
      tags: [Content]
      summary: 当前可展示公告
      responses:
        '200': {description: 公告数组, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/categories:
    get:
      tags: [Content]
      summary: 已发布分类
      responses:
        '200': {description: 分类数组, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/tools:
    get:
      tags: [Content]
      summary: 工具搜索、筛选及 offset 分页
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: category, in: query, schema: {type: string, default: all}}
        - {name: price, in: query, schema: {type: string, enum: [all, free, freemium, paid]}}
        - {name: platform, in: query, schema: {type: string, enum: [all, web, desktop, mobile, api]}}
        - {name: language, in: query, schema: {type: string, enum: [all, zh, multi]}}
        - {name: sort, in: query, schema: {type: string, enum: [recommended, popular, latest, newest, name]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 24}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: 工具数组；meta 包含 total、limit、offset
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
              example: {data: [{id: doubao, slug: doubao, name: 豆包, category: chat, price: free, updated: '2026-07-07'}], meta: {total: 27, limit: 1, offset: 0}}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/tools/{toolId}:
    parameters: [{$ref: '#/components/parameters/ToolId'}]
    get:
      tags: [Content]
      summary: 按 ID 或 slug 读取已发布工具
      responses:
        '200': {description: 工具详情, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/tools/{toolId}/ratings:
    parameters: [{$ref: '#/components/parameters/ToolId'}]
    get:
      tags: [Content]
      summary: 评分汇总（当前用户评分可选登录）
      security: [{cookieAuth: []}, {}]
      responses:
        '200': {description: 评分汇总, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Content]
      summary: 设置当前用户评分
      security: [{cookieAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Rating'}, example: {rating: 5}}}}
      responses:
        '200': {description: 已保存, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Content]
      summary: 删除当前用户评分
      security: [{cookieAuth: []}]
      responses:
        '200': {description: 已删除, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/articles:
    get:
      tags: [Content]
      summary: 教程或资讯列表
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [tutorial, news]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: 文章列表, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/articles/{articleIdOrSlug}:
    get:
      tags: [Content]
      summary: 文章正文及来源链接
      parameters: [{name: articleIdOrSlug, in: path, required: true, schema: {type: string, maxLength: 160}}]
      responses:
        '200': {description: 文章详情, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/news/hot:
    get:
      tags: [Content]
      summary: 近 48 小时多来源热点
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10, default: 10}}]
      responses:
        '200': {description: 热点列表与窗口信息, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 注册并设置 HttpOnly 会话 Cookie
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Register'}
            example: {displayName: 审计用户, email: user@example.com, password: 'correct-horse-battery', consentVersion: '2026-07', consentAccepted: true, termsAccepted: true}
      responses:
        '201': {description: 用户资料与 Set-Cookie, headers: {Set-Cookie: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 登录并创建会话
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Login'}
            example: {email: user@example.com, password: 'correct-horse-battery'}
      responses:
        '200': {description: 用户资料与 Set-Cookie, headers: {Set-Cookie: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: 当前登录用户
      security: [{cookieAuth: []}]
      responses:
        '200': {description: 当前用户资料, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 注销并清除会话
      security: [{cookieAuth: []}]
      responses:
        '200': {description: 退出结果, headers: {Set-Cookie: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account/favorites:
    get:
      tags: [Account]
      summary: 列出当前用户收藏
      security: [{cookieAuth: []}]
      responses:
        '200': {description: 当前用户 toolIds, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account/favorites/{toolId}:
    parameters: [{$ref: '#/components/parameters/ToolId'}]
    put:
      tags: [Account]
      summary: 添加当前用户收藏
      security: [{cookieAuth: []}]
      responses:
        '200': {description: 收藏结果, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}, example: {data: {toolId: chatgpt, favorite: true}}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Account]
      summary: 移除当前用户收藏
      security: [{cookieAuth: []}]
      responses:
        '200': {description: 收藏结果, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account/summary:
    get:
      tags: [Account]
      summary: 当前账号统计
      security: [{cookieAuth: []}]
      responses:
        '200': {description: 汇总, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account/activity:
    get:
      tags: [Account]
      summary: 当前用户收藏、评分、历史、投稿、反馈与偏好
      security: [{cookieAuth: []}]
      responses:
        '200': {description: 活动列表, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account/history:
    delete:
      tags: [Account]
      summary: 清空当前用户浏览历史
      security: [{cookieAuth: []}]
      responses:
        '200': {description: 删除数量, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account/history/{toolId}:
    put:
      tags: [Account]
      summary: 记录当前用户浏览工具
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/ToolId'}]
      responses:
        '200': {description: 已记录, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account/newsletter:
    delete:
      tags: [Account]
      summary: 退订当前用户周报
      security: [{cookieAuth: []}]
      responses:
        '200': {description: 退订结果, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account/notifications:
    patch:
      tags: [Account]
      summary: 更新通知偏好
      security: [{cookieAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Notifications'}, example: {weeklyDigest: true, newToolAlerts: true, favoriteUpdateAlerts: false}}}}
      responses:
        '200': {description: 已更新, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account:
    delete:
      tags: [Account]
      summary: 重新验证密码后注销账号
      security: [{cookieAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeleteAccount'}, example: {confirmation: DELETE, password: 'correct-horse-battery'}}}}
      responses:
        '200': {description: 已注销并清除 Cookie, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/tool-submissions:
    post:
      tags: [Submissions]
      summary: 提交工具审核
      parameters: [{name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 128}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Submission'}
            example: {name: 示例工具, websiteUrl: 'https://example.com', categoryId: coding, summary: 提升日常编码效率的工具。, contactEmail: owner@example.com, declarationAccepted: true, termsAccepted: true, source: sidebar, company: ''}
      responses:
        '201': {description: trackingCode 与 lookupToken, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/tool-submissions/{trackingCode}/status:
    get:
      tags: [Submissions]
      summary: 通过 trackingCode 与 lookupToken 查询状态
      parameters:
        - {name: trackingCode, in: path, required: true, schema: {type: string, maxLength: 64}}
        - {name: token, in: query, required: true, schema: {type: string, minLength: 32, maxLength: 128}}
      responses:
        '200': {description: 审核状态, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/newsletter/subscriptions:
    post:
      tags: [Newsletter]
      summary: 创建或更新周报订阅
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Newsletter'}
            example: {email: reader@example.com, topicSlugs: [], consentVersion: '2026-07', consentAccepted: true, source: news_sidebar}
      responses:
        '201': {description: 订阅结果与退订 token, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/newsletter/subscriptions/{unsubscribeToken}:
    delete:
      tags: [Newsletter]
      summary: 通过退订 token 退订
      parameters: [{name: unsubscribeToken, in: path, required: true, schema: {type: string, minLength: 32, maxLength: 128}}]
      responses:
        '200': {description: 退订状态, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/feedback:
    post:
      tags: [Feedback]
      summary: 提交问题、建议或纠错
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Feedback'}, example: {category: bug, message: 页面出现异常，请协助检查。, pageUrl: /, contactEmail: reader@example.com, consentAccepted: true}}}}
      responses:
        '201': {description: 已提交, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/events/batch:
    post:
      tags: [Analytics]
      summary: 批量上报最多 50 条事件
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Events'}
            example: {visitorId: visitor-uuid, sessionId: session-uuid, events: [{eventId: 00000000-0000-4000-8000-000000000001, eventName: page_view, clientTime: '2026-10-08T02:00:00.000Z', pageType: tools, path: '/', properties: {viewport: '1440x900'}}]}
      responses:
        '202': {description: 入库计数, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '413': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /r/tools/{toolId}:
    get:
      tags: [Content]
      summary: 记录官网点击并跳转至数据库登记的 URL
      parameters:
        - {name: toolId, in: path, required: true, schema: {$ref: '#/components/schemas/ToolId'}}
        - {name: placement, in: query, schema: {type: string, maxLength: 80}}
      responses:
        '302': {description: Location 为官方 URL}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/image-models:
    get:
      tags: [Image]
      summary: 用户可用图片模型
      responses:
        '200': {description: 模型列表, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/image-generations:
    post:
      tags: [Image]
      summary: 调用图片生成服务（需登录）
      security: [{cookieAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Generation'}, example: {model: example-model, prompt: 柔和自然光下的海边小屋, ratio: '1:1', count: 1, style: 清新}}}}
      responses:
        '200': {description: generationId 与限时图片 URL, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/image-history:
    get:
      tags: [Image]
      summary: 当前用户生图历史游标分页
      security: [{cookieAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 24}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 256}}
      responses:
        '200': {description: 图片历史, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Image]
      summary: 清空当前用户生图历史
      security: [{cookieAuth: []}]
      responses:
        '200': {description: 删除数量, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/image-history/{imageId}:
    delete:
      tags: [Image]
      summary: 删除当前用户一张图片
      security: [{cookieAuth: []}]
      parameters: [{name: imageId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 删除结果, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/image-history/{imageId}/image:
    get:
      tags: [Image]
      summary: 读取当前用户已保存图片
      security: [{cookieAuth: []}]
      parameters: [{name: imageId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 图片字节, content: {image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}, image/webp: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/utilities/image-tools/status:
    get:
      tags: [Utilities]
      summary: 本机图像服务能力
      responses:
        '200': {description: 状态, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/utilities/image-tools/background:
    post:
      tags: [Utilities]
