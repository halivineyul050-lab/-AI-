<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6558f5">
  <title>AI 生图 · 泥壳AI</title>
  <meta name="description" content="泥壳AI生图创作台，支持多平台模型切换、提示词创作与本地生图历史。">
  <link rel="canonical" href="https://ontimo.cn/image-generation">
  <link rel="icon" href="/brand-icon-192.png?v=20260916-2">
  <link rel="stylesheet" href="/design-system.css?v=20260915-2">
  <link rel="stylesheet" href="/styles.css?v=20260915-nav-1">
  <link rel="stylesheet" href="/utility-theme.css?v=20260915-nav-1">
  <link rel="stylesheet" href="/image-generation.css?v=20260924-studio-1">
  <script defer src="/utility-theme.js?v=20260915-nav-1"></script>
  <script type="module" src="/image-generation.js?v=20260924-reference-1"></script>
</head>
<body>
  <header class="site-header"><div class="site-header-inner"><a class="site-brand" href="/" aria-label="泥壳AI工具站首页"><span class="brand-mark"><img src="/brand-icon-192.png?v=20260916-2" alt=""></span><span class="site-brand-copy"><strong>泥壳AI</strong><small>工具站</small></span></a><nav class="site-nav" aria-label="主导航"><a class="nav-item" href="/">工具库</a><a class="nav-item" href="/discover">发现</a><a class="nav-item" href="/rankings">榜单</a><a class="nav-item" href="/tutorials">教程</a><a class="nav-item" href="/news">资讯</a><a class="nav-item is-active" href="/image-generation" aria-current="page">AI 生图</a><a class="nav-item" href="/utilities">小工具</a><a class="nav-item" href="/games">休闲小游戏</a></nav><div class="erase-header-actions"><a class="nav-item" href="/favorites">我的收藏</a><button class="icon-button" id="utility-theme" type="button" aria-label="切换明暗主题" title="切换明暗主题">◐</button></div></div></header>

  <main class="image-generation-main">
    <section class="studio-intro" aria-labelledby="image-generation-title">
      <p class="studio-kicker">泥壳AI · IMAGE STUDIO</p>
      <h1 id="image-generation-title">你好，今天想要创作什么？</h1>
      <p>选择站内可用模型，描述灵感，生成并管理你的图片作品。</p>
    </section>

    <div class="studio-mode-switch" role="tablist" aria-label="创作模式">
      <button id="studio-mode-generate" class="studio-mode is-active" type="button" role="tab" aria-selected="true" aria-controls="generate-panel"><span aria-hidden="true">✦</span> 生成</button>
      <button id="studio-mode-history" class="studio-mode" type="button" role="tab" aria-selected="false" aria-controls="history-panel"><span aria-hidden="true">◷</span> 历史</button>
    </div>

    <section id="generate-panel" class="studio-panel" role="tabpanel" aria-labelledby="studio-mode-generate">
      <form id="generation-form" class="generation-composer" novalidate>
        <div class="composer-main">
          <div class="reference-control">
            <input id="reference-input" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="reference-help reference-error" hidden>
            <button id="reference-trigger" class="reference-tile" type="button" aria-describedby="reference-help reference-error"><span class="reference-plus" aria-hidden="true">＋</span><span id="reference-label">添加参考图</span></button>
            <div id="reference-preview" class="reference-preview" hidden></div>
            <p id="reference-help" class="sr-only">上传 PNG、JPEG 或 WebP 图片作为参考，最大 10MB；仅支持参考图编辑的平台模型可用</p>
          </div>
          <div class="prompt-field">
            <label class="sr-only" for="prompt-input">画面描述</label>
            <textarea id="prompt-input" maxlength="1000" rows="5" placeholder="描述你想生成的画面，例如：一只举着火炬的黑白猫，紫色梦幻背景，精致插画风……"></textarea>
            <p id="prompt-error" class="field-error" hidden></p>
          </div>
        </div>

        <div class="composer-toolbar">
          <label class="compact-select model-select-control"><span>模型</span><select id="model-select" name="modelRecordId" aria-label="生成模型" disabled><option value="">加载中…</option></select></label>
          <label class="compact-select"><span>比例</span><select id="ratio-select" name="ratio" aria-label="画面比例" disabled></select></label>
          <label class="compact-select"><span>风格</span><select id="style-select" name="style" aria-label="图片风格"><option value="自动">自动</option><option value="电影感">电影感</option><option value="插画">插画</option><option value="3D">3D</option><option value="写实">写实</option><option value="国风">国风</option></select></label>
          <label class="compact-select"><span>数量</span><select id="count-select" name="count" aria-label="生成数量" disabled></select></label>
          <span class="prompt-count"><b id="prompt-count">0</b> / 1000</span>
          <button id="generate-submit" class="generate-button" type="submit" disabled>正在加载模型…</button>
        </div>
        <p id="reference-error" class="studio-message" data-tone="error" role="alert" hidden></p>
      </form>

      <div class="inspiration-row" aria-label="快捷灵感">
        <button type="button" class="inspiration-chip" data-prompt="电影感产品海报，戏剧光影，精致构图，高级质感">电影感海报</button>
        <button type="button" class="inspiration-chip" data-prompt="公众号头图，主题突出，留出标题空间，紫色科技感">公众号封面</button>
        <button type="button" class="inspiration-chip" data-prompt="可爱的3D萌宠角色，柔和灯光，细腻材质，纯净背景">3D 萌宠</button>
        <button type="button" class="inspiration-chip" data-prompt="国风插画，东方留白，细腻笔触，雅致配色">国风插画</button>
        <button type="button" class="inspiration-chip" data-prompt="电商产品主图，干净背景，商业摄影，细节清晰">电商产品图</button>
      </div>

      <div id="generation-status" class="generation-status" aria-live="polite" hidden></div>
      <section id="generation-results" class="generation-results" aria-label="生成结果" hidden></section>
    </section>

    <section id="history-panel" class="studio-panel history-panel" role="tabpanel" aria-labelledby="studio-mode-history" hidden>
      <header class="history-header">
        <div><p class="studio-kicker">LOCAL GALLERY</p><h2>生图历史</h2><p>最近 50 张图片保存在当前浏览器中，清理浏览器数据后无法恢复。</p></div>
        <button id="history-clear" class="studio-secondary" type="button">清空历史</button>
      </header>
      <p id="history-status" class="studio-message" aria-live="polite"></p>
      <div id="history-empty" class="history-empty"><strong>还没有历史作品</strong><p>完成一次生图后，图片会自动保存在这里。</p></div>
      <div id="history-grid" class="history-grid" aria-label="本地生图历史"></div>
    </section>
  </main>
</body>
</html>
